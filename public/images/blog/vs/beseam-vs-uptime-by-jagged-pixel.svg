<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Beseam vs Uptime (Jagged Pixel)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071021"/>
      <stop offset="1" stop-color="#1a2a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="48" fill="url(#bg)"/>
  <rect x="64" y="64" width="1072" height="502" rx="40" fill="#0b1624" opacity="0.72"/>
  <rect x="64" y="64" width="1072" height="6" fill="url(#accent)" opacity="0.9"/>

  <text x="96" y="148" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="54" font-weight="900" fill="#e5e7eb">
    Beseam vs Uptime (Jagged Pixel)
  </text>
  <text x="96" y="198" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="22" font-weight="500" fill="#9ca3af">
    Synthetic tests vs change-linked rollback
  </text>

  <g filter="url(#shadow)">
    <rect x="96" y="260" width="488" height="246" rx="28" fill="#0b1220" stroke="#1f2937"/>
    <rect x="616" y="260" width="488" height="246" rx="28" fill="#0b1220" stroke="#1f2937"/>
  </g>

  <g>
    <rect x="136" y="302" width="72" height="72" rx="18" fill="#111827" stroke="#1f2937"/>
    <image href="/favicon/favicon-96x96.png" x="146" y="312" width="52" height="52" />
    <text x="232" y="350" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="32" font-weight="900" fill="#e5e7eb">Beseam</text>
    <text x="232" y="390" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="18" font-weight="500" fill="#9ca3af">Revenue guardrails post-deploy</text>
  </g>

  <g>
    <rect x="656" y="302" width="72" height="72" rx="18" fill="#0b1624" stroke="#1f2937"/>
    <text x="692" y="348" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="22" font-weight="900" fill="#e5e7eb">UP</text>
    <text x="752" y="350" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="32" font-weight="900" fill="#e5e7eb">Uptime</text>
    <text x="752" y="390" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="18" font-weight="500" fill="#9ca3af">Automated store tests</text>
    <text x="752" y="430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="14" font-weight="600" fill="#6b7280">apps.shopify.com/uptime</text>
  </g>

  <g>
    <circle cx="600" cy="383" r="30" fill="#0b1624" stroke="#1f2937"/>
    <text x="600" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial" font-size="16" font-weight="900" fill="#e5e7eb">VS</text>
  </g>
</svg>

